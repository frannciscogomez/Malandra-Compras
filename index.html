<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malandra · Pedido Santa Catalina</title>
<style>
  :root{
    --bg: #1c1a17;
    --bg-panel: #24211d;
    --bg-row: #2b2722;
    --bg-row-hover: #332e28;
    --ink: #f1e9db;
    --ink-dim: #a99e8c;
    --ink-faint: #766b5c;
    --gold: #e0a840;
    --gold-dim: #7a5f2c;
    --clay: #c4623f;
    --clay-dim: #4a2c20;
    --sky: #6fa0c4;
    --line: #3a352d;
    --radius: 10px;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    padding-bottom:64px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 14px;}
  header{
    position:sticky;top:0;z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:14px 0 10px;
  }
  .brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .brand-name{
    font-size:22px;font-weight:800;letter-spacing:0.5px;
    text-transform:uppercase;color:var(--ink);
  }
  .brand-name span{color:var(--gold);}
  .brand-loc{
    font-size:11px;color:var(--ink-dim);text-transform:uppercase;
    letter-spacing:1.5px;font-weight:600;
  }
  .status-row{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:10px;
  }
  .counter{
    display:flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:13px;color:var(--ink-dim);
  }
  .counter b{color:var(--clay);font-size:16px;}
  .reset-btn{
    background:none;border:1px solid var(--line);color:var(--ink-dim);
    font-size:11px;padding:6px 10px;border-radius:20px;cursor:pointer;
    text-transform:uppercase;letter-spacing:0.5px;font-weight:600;
  }
  .reset-btn:active{background:var(--bg-row);}
  .ticket{
    margin-top:16px;background:var(--bg-panel);
    border-radius:var(--radius);
    border:1px dashed var(--gold-dim);
    padding:16px 16px 18px;
    position:relative;
  }
  .ticket-head{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:10px;
  }
  .ticket-title{
    font-family:var(--mono);font-size:12px;text-transform:uppercase;
    letter-spacing:2px;color:var(--gold);font-weight:700;
  }
  .ticket-empty{
    font-family:var(--mono);font-size:13px;color:var(--ink-faint);
    text-align:center;padding:18px 0;
  }
  .ticket-group{margin-top:10px;}
  .ticket-group-name{
    font-family:var(--mono);font-size:11px;color:var(--sky);
    text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;
  }
  .ticket-line{
    font-family:var(--mono);font-size:13.5px;color:var(--ink);
    display:flex;justify-content:space-between;gap:10px;
    padding:2px 0;border-bottom:1px dotted var(--line);
  }
  .ticket-line .q{color:var(--clay);white-space:nowrap;}
  .ticket-foot{
    margin-top:12px;padding-top:10px;border-top:1px dashed var(--gold-dim);
    font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);
    text-align:center;letter-spacing:0.5px;
  }
  .groups{margin-top:20px;}
  .group{
    margin-bottom:10px;
    background:var(--bg-panel);
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--line);
  }
  .group-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 14px;cursor:pointer;user-select:none;
  }
  .group-head:active{background:var(--bg-row);}
  .group-head-left{display:flex;align-items:center;gap:9px;}
  .group-name{font-weight:700;font-size:14.5px;letter-spacing:0.3px;}
  .day-tag{
    font-size:9.5px;text-transform:uppercase;letter-spacing:0.6px;
    color:var(--ink-dim);background:var(--bg-row);
    padding:3px 7px;border-radius:20px;font-weight:600;
  }
  .day-tag.today{color:#1c1a17;background:var(--gold);}
  .group-count{font-family:var(--mono);font-size:12px;color:var(--ink-faint);}
  .chevron{
    color:var(--ink-faint);font-size:11px;transition:transform .15s ease;
  }
  .group.open .chevron{transform:rotate(180deg);}
  .group-items{
    max-height:0;overflow:hidden;transition:max-height .2s ease;
  }
  .group.open .group-items{max-height:2000px;}
  .item{
    display:flex;align-items:center;gap:11px;
    padding:11px 14px;border-top:1px solid var(--line);
  }
  .item:active{background:var(--bg-row-hover);}
  .check{
    width:21px;height:21px;flex:0 0 21px;
    border-radius:6px;border:1.5px solid var(--ink-faint);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:13px;color:transparent;
  }
  .check.on{background:var(--clay);border-color:var(--clay);color:#1c1a17;font-weight:800;}
  .item-name{flex:1;font-size:14.5px;}
  .item.on .item-name{color:var(--ink);}
  .item:not(.on) .item-name{color:var(--ink-dim);}
  .qty-input{
    width:76px;background:var(--bg-row);border:1px solid var(--line);
    color:var(--ink);border-radius:6px;padding:6px 8px;font-size:13px;
    font-family:var(--mono);text-align:right;
  }
  .qty-input::placeholder{color:var(--ink-faint);}
  footer{
    max-width:640px;margin:22px auto 0;padding:0 14px;
    font-size:11px;color:var(--ink-faint);text-align:center;
    line-height:1.5;
  }
  .loading{
    padding:60px 14px;text-align:center;color:var(--ink-dim);
    font-family:var(--mono);font-size:13px;
  }
  .err{
    margin-top:12px;background:var(--clay-dim);border:1px solid var(--clay);
    color:var(--ink);padding:10px 12px;border-radius:8px;font-size:12.5px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-name">Malan<span>dra</span></div>
      <div class="brand-loc">Sta. Catalina</div>
    </div>
    <div class="status-row">
      <div class="counter">Faltan <b id="countNum">0</b> productos</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span id="syncTag" style="font-family:var(--mono);font-size:10px;color:var(--ink-faint);">actualizado ahora</span>
        <button class="reset-btn" id="resetBtn">Reiniciar semana</button>
      </div>
    </div>
  </header>
  <div id="app">
    <div class="loading">Cargando lista…</div>
  </div>
  <footer>Lo que se marca acá queda visible para todos — cocina, barra y dueño, en tiempo real.</footer>
</div>
<script>
const DAYS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const todayName = DAYS[new Date().getDay()];

const DATA = [
  { name:"Garda", day:"Viernes", items:[
    "Mozzarella","Salsa Pomodoro","Peperoni","Jamón cocido","Parmesano","Nata","Bacon",
    "Jamón serrano","Queso cabra","Sobrasada","Mortadela","Queso scamorza","Roquefort",
    "Pinsa","Harina H24","Harina H16","Pesto genovés","Burrata","Aceitunas","Aceitunas negras",
    "Pesto rosso","Crema de calabaza"
  ]},
  { name:"Makro", day:"Semanal", items:[
    "Pollo","Pulled pork","Cheddar","Barbacoa","Ketchup","Mostaza","Miel","Mayonesa",
    "Cebolla y pimiento congelado","Verduras varias","Aceite","Aceite de oliva","Tomates",
    "Tomates cherry","Cebolla","Cebolla morada","Cebolla verdeo","Albahaca","Rúcula",
    "Morrones","Ajo","Champiñones","Guindillas","Piña","Palmitos","Morrones asados",
    "Anchoas","Berenjenas","Calabacín","Cosito de pizza","Film","Papel aluminio","Hielo","Nata"
  ]},
  { name:"Maleta de Sabores", day:"Viernes", items:[
    "Orégano","Pimentón","Ají molido","Pimienta negra","Cayena","Sal","Muzzarella Argentina",
    "Fernet Argentino","Dulce de leche","Tapa de empanadas"
  ]},
  { name:"Limpieza y Packaging", day:"Viernes", items:[
    "Papel higiénico","Papel de cocina","Detergente","Lejía","Limpia cristales","Desengrasante",
    "Desatascador de tuberías","Detergente lavavajillas","Abrillantador lavavajillas","Cif",
    "Pastillas inodoro","Servilletas","Esponjas","Estropajo acero","Fregona","Escoba","Bayetas",
    "Repasadores","Microfibra para fajinar","Alcohol","Cajas de empanadas","Rollos térmicos impresoras"
  ]},
  { name:"Carnicería", day:"Semanal", items:["Vacío"] },
  { name:"Boldis", day:"Martes y Viernes", items:[
    "Stella barril","Alhambra barril","Mahou botella","Alhambra botella","Corona","Mahou sin alcohol",
    "Cerveza sin gluten","Mahou Radler","Pepsi","Pepsi zero","7up","Agua","Agua con gas",
    "Aquarade limón","Aquarade naranja","Lipton limón","Lipton maracuyá","Lipton melocotón",
    "Ginger Ale","Tónica","Tónica pomelo","Leche"
  ]},
  { name:"Moyá", day:"Bar", items:[
    "Cava","Tequila Mijenta","Tequila Mijenta Reposado","Hierbas Mallorca","Havana 7 años","Bacardi",
    "Amazonas","Vermut Rumbo Negre","Vermut Rumbo Blanco","Vermut Yzaguirre Blanco",
    "Vermut Yzaguirre Rosso","Martini Rosso","Aperol","Pampelle","Jack Daniels","Ballantines",
    "Johnnie Walker BL","Grey Goose","Smirnoff","Absolut","Bombay Sapphire","G'Vine","Mare",
    "Monkey 47","Seagrams","Tanqueray"
  ]},
  { name:"Cafetería", day:"Día antes", items:[
    "Cápsula café","Cápsula descafeinado","Azúcar","Sacarina"
  ]}
];

function slug(s){ return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-"); }

const STORAGE_URL = "https://script.google.com/macros/s/AKfycbxywt-VpZSjqS_FgeE_hXFxcPkxZLTuUpW2ptYAV2hFULzKY-zTlF_qrI_giKGm1zODFw/exec";

let state = {};
let openGroups = new Set([DATA[0].name]);

async function loadState(){
  try{
    const res = await fetch(STORAGE_URL, { method: "GET" });
    const json = await res.json();
    state = json || {};
  }catch(e){
    state = {};
  }
}

async function saveState(){
  try{
    const res = await fetch(STORAGE_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(state)
    });
    if(!res.ok){ showError("No se pudo guardar. Probá de nuevo."); }
    else{ lastStateJSON = JSON.stringify(state); lastSyncAt = Date.now(); }
  }catch(e){
    showError("No se pudo guardar. Probá de nuevo.");
  }
}

function showError(msg){
  const app = document.getElementById("app");
  const div = document.createElement("div");
  div.className = "err";
  div.textContent = msg;
  app.prepend(div);
  setTimeout(()=>div.remove(), 3500);
}

function itemId(groupName, itemName){ return slug(groupName)+"__"+slug(itemName); }

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";

  const ticket = document.createElement("div");
  ticket.className = "ticket";

  let missingByGroup = [];
  let totalMissing = 0;
  DATA.forEach(g=>{
    const lines = g.items.filter(it => state[itemId(g.name,it)]?.falta);
    if(lines.length){
      missingByGroup.push({group:g.name, items:lines});
      totalMissing += lines.length;
    }
  });

  ticket.innerHTML = `
    <div class="ticket-head">
      <div class="ticket-title">Pedido de la semana</div>
      <div style="font-family:var(--mono);font-size:11px;color:var(--ink-faint);">${new Date().toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</div>
    </div>
  `;

  if(totalMissing === 0){
    const empty = document.createElement("div");
    empty.className = "ticket-empty";
    empty.textContent = "Nada marcado todavía. Tocá los productos que faltan abajo.";
    ticket.appendChild(empty);
  } else {
    missingByGroup.forEach(mg=>{
      const gDiv = document.createElement("div");
      gDiv.className = "ticket-group";
      const gName = document.createElement("div");
      gName.className = "ticket-group-name";
      gName.textContent = mg.group;
      gDiv.appendChild(gName);
      mg.items.forEach(it=>{
        const qty = state[itemId(mg.group,it)]?.qty || "";
        const line = document.createElement("div");
        line.className = "ticket-line";
        line.innerHTML = `<span>${it}</span><span class="q">${qty ? qty : "—"}</span>`;
        gDiv.appendChild(line);
      });
      ticket.appendChild(gDiv);
    });
    const foot = document.createElement("div");
    foot.className = "ticket-foot";
    foot.textContent = "Copiá esta lista al pedir a cada proveedor";
    ticket.appendChild(foot);
  }
  app.appendChild(ticket);

  document.getElementById("countNum").textContent = totalMissing;

  const groupsWrap = document.createElement("div");
  groupsWrap.className = "groups";

  DATA.forEach(g=>{
    const missingCount = g.items.filter(it => state[itemId(g.name,it)]?.falta).length;
    const isOpen = openGroups.has(g.name);
    const isToday = g.day.split(" y ").some(d => d.trim() === todayName) || g.day === todayName;

    const groupDiv = document.createElement("div");
    groupDiv.className = "group" + (isOpen ? " open" : "");

    const head = document.createElement("div");
    head.className = "group-head";
    head.innerHTML = `
      <div class="group-head-left">
        <span class="group-name">${g.name}</span>
        <span class="day-tag${isToday ? ' today':''}">${isToday ? 'Pedir hoy' : g.day}</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="group-count">${missingCount ? missingCount+' falta' : ''}</span>
        <span class="chevron">▾</span>
      </div>
    `;
    head.addEventListener("click", ()=>{
      if(openGroups.has(g.name)) openGroups.delete(g.name);
      else openGroups.add(g.name);
      render();
    });
    groupDiv.appendChild(head);

    const itemsWrap = document.createElement("div");
    itemsWrap.className = "group-items";

    g.items.forEach(it=>{
      const id = itemId(g.name,it);
      const s = state[id] || {falta:false, qty:""};
      const row = document.createElement("div");
      row.className = "item" + (s.falta ? " on" : "");

      const check = document.createElement("div");
      check.className = "check" + (s.falta ? " on" : "");
      check.textContent = "✓";
      check.addEventListener("click", async ()=>{
        state[id] = state[id] || {falta:false, qty:""};
        state[id].falta = !state[id].falta;
        render();
        await saveState();
      });

      const name = document.createElement("div");
      name.className = "item-name";
      name.textContent = it;

      row.appendChild(check);
      row.appendChild(name);

      if(s.falta){
        const qtyInput = document.createElement("input");
        qtyInput.className = "qty-input";
        qtyInput.placeholder = "cant.";
        qtyInput.value = s.qty || "";
        qtyInput.addEventListener("change", async (e)=>{
          state[id].qty = e.target.value;
          await saveState();
          render();
        });
        row.appendChild(qtyInput);
      }

      itemsWrap.appendChild(row);
    });

    groupDiv.appendChild(itemsWrap);
    groupsWrap.appendChild(groupDiv);
  });

  app.appendChild(groupsWrap);
}

document.getElementById("resetBtn").addEventListener("click", async ()=>{
  if(!confirm("¿Reiniciar la lista? Se van a desmarcar todos los productos.")) return;
  state = {};
  render();
  await saveState();
});

let lastStateJSON = "";
let lastSyncAt = Date.now();

function updateSyncTag(){
  const tag = document.getElementById("syncTag");
  if(!tag) return;
  const secs = Math.round((Date.now() - lastSyncAt) / 1000);
  tag.textContent = secs < 5 ? "actualizado ahora" : `actualizado hace ${secs}s`;
}

async function pollState(){
  const active = document.activeElement;
  if(active && active.classList && active.classList.contains("qty-input")) return;

  try{
    const res = await fetch(STORAGE_URL, { method: "GET" });
    const json = await res.json();
    const freshJSON = JSON.stringify(json || {});
    if(freshJSON !== lastStateJSON){
      state = json || {};
      lastStateJSON = freshJSON;
      render();
    }
    lastSyncAt = Date.now();
  }catch(e){}
}

(async function init(){
  await loadState();
  lastStateJSON = JSON.stringify(state);
  render();
  setInterval(pollState, 6000);
  setInterval(updateSyncTag, 1000);
})();
</script>
</body>
</html>
